name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Manifest, documentation and language parity
        run: python -I tools/ci_validate.py
      - name: Tests of the helpers of the deployment (updates, backup, units)
        run: |
          python -I tests/test_update_helper.py
          python -I tests/test_backup.py
          python -I tests/test_deploy_files.py
      - name: Contract of the interface (OpenAPI, table of routes) against the router
        run: |
          python -I tools/make_openapi.py --check
          python -I tools/check_openapi.py
      - name: Pictures of the README
        run: |
          python -I tools/make_architecture.py --check
          python -I tools/make_structure.py --check --readmes
      - name: The change has a line in the CHANGELOG
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -I tools/changelog_pr_check.py --base "origin/$BASE_REF"

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # the server uses the libraries of the programs, which have to be next to it
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: EH3D-SERVER
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-COMMON
          ref: v0.2.1
          path: EH3D-COMMON
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-DRILLPRO
          ref: v0.1.7
          path: EH3D-DRILLPRO
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-ROUTEPRO
          ref: v0.1.6
          path: EH3D-ROUTEPRO
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: JuanenRac/EH3D-CORE-LIBS
          ref: v0.0.9
          path: EH3D-CORE-LIBS
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-SERVER
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - name: Format
        working-directory: EH3D-SERVER
        run: cargo fmt --all --check
      - name: Lints
        working-directory: EH3D-SERVER
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: EH3D-SERVER
        run: cargo test --all-targets
      - name: Lints and tests with the serial port support
        working-directory: EH3D-SERVER
        run: |
          cargo clippy --all-targets --features serial -- -D warnings
          cargo test --all-targets --features serial
