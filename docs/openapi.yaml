              type: string
              description: The id of an artifact that holds the STL or 3MF.
            base64:
              type: string
              description: "The bytes of the file, in base64."
          description: One of the two.
        profile:
          type: object
          additionalProperties: true
          description: "`{\"machine\": \"<id of a 3D printer>\"}`, or the settings of a printer (`model`, `hotend_max_c`, `bed_x_mm`...) with the keys of slicing: `layer_mm`, `line_mm`, `infill_pct`, `solid_layers`, `hotend_c`, `bed_c`, `print_feed_mm_s`, `travel_feed_mm_s` and, for the engine `phoenix`, `phoenix_printer`."
        engine:
          type: string
          enum:
            - builtin
            - phoenix
          description: "`builtin` (the default) is the small slicer of the server; `phoenix` runs the program of the suite that `slice_phoenix_bin` names."
        output:
          type: string
          enum:
            - view
            - artifact
          description: "`view` (the default) gives the program in the answer, `artifact` keeps it in the store of the caller."
        artifact_name:
          type: string
          maxLength: 120
        format:
          type: string
          enum:
            - gcode
            - bgcode
          description: "`gcode` (the default) gives the text of the program; `bgcode` gives a binary G-code file (`.bgcode`: metadata, CRC-32 per block, heatshrink-packed G-code) as `bgcode_base64` or, with `output` `artifact`, as an artifact of the kind `application/x-bgcode`."
      required:
        - mesh
        - profile
      additionalProperties: false
