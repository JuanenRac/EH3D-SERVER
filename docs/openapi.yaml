# The contract of the REST interface of the EH3D server (OpenAPI 3.1).
# Written by tools/make_openapi.py from the same table as openapi.json: do not edit by hand.
openapi: "3.1.0"
info:
  title: EH3D Server API
  version: "0.2.7"
  summary: The REST and websocket interface of the EH3D server.
  description: "Everything is under `/api/v1/` and answers JSON. A mistake is `{\"error\": \"<code>\", \"detail\": \"...\"}` with the status that fits; the codes are the catalog in `docs/error-codes.json`. Except the health check, the first set-up and the login, every request carries `Authorization: Bearer <token>`: the token of a login or the token of a program. A viewer reads, an operator also prepares, starts, stops and confirms jobs, an administrator also manages users, tokens and machines; a token may be limited further by scopes. Limits: passwords are 8 to 128 characters, a request body is at most `max_body_mb` of `server.cfg` (else `too_big`), a ticket is good for one use within 30 seconds, and five wrong passwords block a name for a while (`throttled`). `docs/API.md` explains the behaviour; this document is the contract of the routes."
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: "/api/v1"
    description: The default port of the server is 18200.
tags:
  - name: system
    description: "Health, first set-up and the live session."
  - name: auth
    description: "Login, the own account and tickets."
  - name: admin
    description: "Users, tokens of programs and updates of the services."
  - name: machines
    description: "The machines, their spindle and the fleet."
  - name: jobs
    description: "Jobs that move a machine: planned, started and confirmed by a person."
  - name: head
    description: "The node of the drill head: status, camera, light ring and quality check."
  - name: tasks
    description: Work for the computer that never moves a machine.
  - name: printers
    description: "The 3D printers the server watches: their state is read with GET and nothing is ever asked of them (off until the switch printers_enabled is on). The other methods change the list of the server only."
  - name: pnp
    description: "The feeder and head nodes of the pick-and-place machines: registered, asked with their token and shown with their health (off until the switch pnp_nodes_enabled is on)."
  - name: artifacts
    description: "Files kept by identity: artifacts, blobs and uploads."
  - name: projects
    description: Projects with revisions and explicit sharing.
  - name: store
    description: "The project store of every application: projects, files with versions, editing locks and the .eh3dproj container."
  - name: catalogs
    description: "Shared catalogs the applications read: materials, tools, machine profiles, footprints, symbols and components."
  - name: slice
    description: "Slicing a mesh into G-code inside the limits of a printer profile (off until the switch slice_enabled is on)."
  - name: work
    description: "Plugins and their machines, the generic queue of jobs with its history, the stream of events and the notifications."
paths:
  "/health":
    get:
      operationId: get_health
      tags:
        - system
      summary: Health check
      description: "Open to anyone, so it says little. With a valid token it also gives the uptime, the state of the storage and the features of this build. No login."
      x-role: none
      x-error-codes: []
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: "The name, the version and whether the server is well."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
              example:
                name: eh3d-server
                version: "0.1.1"
                api_revision: 1
                status: ok
  "/openapi.json":
    get:
      operationId: get_openapi.json
      tags:
        - system
      summary: The contract of the interface this server has
      description: "Lets a client ask which routes the server it talks to has, and notice the ones that were withdrawn. It is the document the server was built with (`docs/openapi.json`). A request with `If-None-Match` that names the tag (or `*`) is answered `304` with no body. Role viewer or higher."
      x-role: viewer
      x-error-codes:
        - unauthorized
      responses:
        "200":
          description: "The document, with an `ETag` (the SHA-256 of the document in quotes) and `Cache-Control: private, max-age=300`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OpenApiDocument"
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "304":
          description: "The document is the one the `If-None-Match` header names; no body."
