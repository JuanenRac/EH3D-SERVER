      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettingsContract"
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "403":
          description: "Refused with `forbidden`, `forbidden_scope`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: forbidden
                detail: ""
  "/settings/values":
    get:
      operationId: get_settings_values
      tags:
        - admin
      summary: "The values in force of the settings, light and read only"
      description: "For the screens of the machines and any client that logs in as an operator or a viewer: for each key of `server.cfg`, the value in force (`v`), where it comes from (`origin`) and whether `PUT /auth/policy` changes it (`editable`). A secret key shows `***` and a key that is a path of the computer is `hidden`; there are no texts, so the answer is a few kilobytes (never more than 16 KiB). `contract_hash` says whether the copy of the contract that the client holds is still the one of this server. `If-None-Match` with the tag is answered `304` with no body. A refusal is in the audit like the others. Role viewer or higher."
      x-role: viewer
      x-error-codes:
        - bad_request
        - unauthorized
      parameters:
        - name: keys
          in: query
          required: false
          description: "Comma separated keys of the contract; the answer lists only these."
          schema:
            type: string
        - name: group
          in: query
          required: false
          description: "The id of a group of the contract; the answer lists only its keys."
          schema:
            type: string
      responses:
        "200":
          description: "The values, with an `ETag` (the SHA-256 of the answer in quotes) and `Cache-Control: private, no-cache`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettingsValues"
        "400":
          description: "Refused with `bad_request`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: bad_request
                detail: ""
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "304":
          description: "The answer is the one the `If-None-Match` header names; no body."
  "/auth/keys":
    get:
      operationId: get_auth_keys
      tags:
        - auth
      summary: The identifiers of the keys and the fingerprint of the certificate
      description: "The tokens of programs by id, name, role and age, and the SHA-256 fingerprint of the certificate named by `tls_cert_file`. No secret is ever in it. Role admin. Scope `admin:tokens` if the token is limited by scopes."
      x-role: admin
      x-scope: "admin:tokens"
      x-error-codes:
        - forbidden
        - forbidden_scope
        - unauthorized
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthKeys"
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "403":
          description: "Refused with `forbidden`, `forbidden_scope`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: forbidden
                detail: ""
  "/audit":
    get:
      operationId: get_audit
      tags:
        - admin
      summary: Read the audit
      description: "Reads `audit.jsonl` and the older copy it was set aside as, the newest first. Role admin. Scope `admin:policy` if the token is limited by scopes."
      x-role: admin
      x-scope: "admin:policy"
      x-error-codes:
        - forbidden
        - forbidden_scope
        - unauthorized
      parameters:
        - name: since
          in: query
          required: false
          description: "Only the lines from this moment (seconds since 1970)."
          schema:
            type: integer
        - name: until
          in: query
          required: false
          description: Only the lines up to this moment.
          schema:
            type: integer
        - name: who
          in: query
          required: false
          description: Only the lines of this person or token.
          schema:
            type: string
        - name: event
          in: query
          required: false
          description: Only this event.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Up to this many lines (100)."
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuditLines"
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "403":
          description: "Refused with `forbidden`, `forbidden_scope`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: forbidden
                detail: ""
  "/apps/{app}/quota":
    get:
      operationId: get_apps_app_quota
      tags:
        - store
      summary: The limits of the store and what the application uses
      description: "`project_max_mb`, `project_max_file_mb`, `project_max_files` and `project_max_projects` with the use, so that a client shows the limit and not only the use. Role viewer or higher. Scope `projects:read` if the token is limited by scopes."
      x-role: viewer
      x-scope: "projects:read"
      x-error-codes:
        - bad_app
        - forbidden_scope
        - unauthorized
      parameters:
        - name: app
          in: path
          required: true
          description: "The application that owns the projects (`studio`, `android`, `pcb`...; see docs/AUTH.md)."
          schema:
            type: string
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AppQuota"
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "403":
          description: "Refused with `forbidden_scope`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: forbidden_scope
                detail: ""
        "422":
          description: "Refused with `bad_app`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: bad_app
                detail: ""
  "/apps/pcb/jobs":
    post:
      operationId: post_apps_pcb_jobs
      tags:
        - work
      summary: Run the design program on a board of a project
      description: "Runs the installed program (`design_program`) with `design_run` on, no shell and an empty environment, in a folder of its own, with a time and an output limit. The job is in the queue (plugin `phoenix`) and ends `done` or `failed`; the report is written to the project as `reports/<kind>.json`. The token also needs `projects:write`. Without the setting: `501 design_run_unavailable`. Role operator or higher. Scope `jobs:prepare` if the token is limited by scopes."
      x-role: operator
      x-scope: "jobs:prepare"
      x-error-codes:
        - bad_design_request
        - bad_filename
        - bad_request
        - design_run_unavailable
        - forbidden
        - forbidden_scope
        - queue_full
        - unauthorized
        - unknown_file
        - unknown_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DesignJobRequest"
            example:
              kind: check
              project: p-0190
              file: board.json
              options: {}
      responses:
        "201":
          description: Done.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkJob"
        "400":
          description: "Refused with `bad_request`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: bad_request
                detail: ""
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "403":
          description: "Refused with `forbidden`, `forbidden_scope`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: forbidden
                detail: ""
        "404":
          description: "Refused with `unknown_file`, `unknown_project`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unknown_file
                detail: ""
        "422":
          description: "Refused with `bad_design_request`, `bad_filename`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: bad_design_request
                detail: ""
        "429":
          description: "Refused with `queue_full`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: queue_full
                detail: ""
        "501":
          description: "Refused with `design_run_unavailable`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: design_run_unavailable
                detail: ""
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "The token of a login (`POST /login`) or of a program (`POST /tokens`)."
    ticketAuth:
      type: apiKey
      in: query
      name: ticket
      description: "A ticket from `POST /tickets`, for the camera and the websocket."
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
          description: "A code of the catalog (docs/error-codes.json)."
        detail:
          type: string
          description: "Words for a person; may be empty."
      required:
        - error
        - detail
      additionalProperties: false
      description: "Every refusal has this shape, with the status that fits the code."
    Ok:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
      additionalProperties: false
    OpenApiDocument:
      type: object
      additionalProperties: true
      description: "The OpenAPI 3.1 document of the interface, the same as `docs/openapi.json` of the repository."
    Role:
      type: string
      enum:
        - viewer
        - operator
        - admin
    Health:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
          description: The version of the server.
        api_revision:
          type: integer
        status:
          type: string
          enum:
            - ok
            - degraded
        uptime_s:
          type: integer
        storage:
          type: object
          properties:
            writable:
              type: boolean
          additionalProperties: false
        recovered_locks:
          type: integer
        features:
          type: object
          properties:
            serial:
              type: boolean
            studio:
              type: boolean
            updates:
              type: boolean
            url_token:
              type: boolean
            local_until_setup:
              type: boolean
            trust_forwarded_for:
              type: boolean
            exit_on_panic:
              type: boolean
            persist_sessions:
              type: boolean
          additionalProperties: false
      required:
        - name
        - version
        - api_revision
        - status
      additionalProperties: false
      description: "`uptime_s`, `storage`, `recovered_locks` and `features` come only with a valid token."
    SetupState:
      type: object
      properties:
        needed:
          type: boolean
      required:
        - needed
      additionalProperties: false
    SetupRequest:
      type: object
      properties:
        code:
          type: string
          description: The set-up code the server prints on its console.
        name:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - code
        - name
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
      required:
        - name
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        expires_s:
          type: integer
      required:
        - token
        - name
        - role
        - expires_s
      additionalProperties: false
    Session:
      type: object
      properties:
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        is_token:
          type: boolean
      required:
        - name
        - role
        - is_token
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        old:
          type: string
        new:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - old
        - new
      additionalProperties: false
    User:
      type: object
      properties:
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        disabled:
          type: boolean
      required:
        - name
        - role
        - disabled
      additionalProperties: false
    NewUser:
      type: object
      properties:
        name:
          type: string
          description: "Letters, digits, `.`, `_` and `-`, up to 32."
          maxLength: 32
        role:
          "$ref": "#/components/schemas/Role"
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - name
        - role
        - password
      additionalProperties: false
    UserChange:
      type: object
      properties:
        role:
          "$ref": "#/components/schemas/Role"
        password:
          type: string
          minLength: 8
          maxLength: 128
        disabled:
          type: boolean
      additionalProperties: false
    Token:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        created:
          type: integer
        last_used:
          oneOf:
            - type: integer
            - type: "null"
        expires:
          oneOf:
            - type: integer
            - type: "null"
        template:
          oneOf:
            - type: string
            - type: "null"
        scopes:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      required:
        - id
        - name
        - role
        - created
      description: "Seconds since 1970 for `created`, `last_used` and `expires`; the secret is never listed."
    NewToken:
      type: object
      properties:
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        days:
          type: integer
          minimum: 1
          maximum: 3650
        template:
          type: string
          enum:
            - phoenix
            - cam
            - client
            - custom
        scopes:
          type: array
          items:
            type: string
          description: "Scopes that narrow the role, see the scopes table of docs/API.md."
      required:
        - name
        - role
      additionalProperties: false
    TokenSecret:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
          description: Shown this once.
      required:
        - id
        - token
      additionalProperties: false
    Connection:
      type: object
      properties:
        kind:
          type: string
          enum:
            - node
            - demo
            - grbl
        address:
          type: string
          description: "host:port of the node."
        token:
          type: string
          description: "The node's access token; never shown by the API (`token_set` instead), and empty on an update keeps the stored one."
        token_set:
          type: boolean
        port:
          type: string
          description: Serial port of a GRBL controller.
        baud:
          type: integer
          minimum: 1200
          maximum: 2000000
      required:
        - kind
      additionalProperties: false
    Machine:
      type: object
      properties:
        id:
          type: string
          description: "Lowercase letters, digits and hyphens, up to 32."
        name:
          type: string
        model:
          type: string
        station:
          type: string
          description: "The bench, room or workshop; empty when none."
        connection:
          "$ref": "#/components/schemas/Connection"
        dcf:
          type: string
          description: The text of DRILLPRO.DCF.
        rcf:
          type: string
          description: The text of ROUTEPRO.RCF.
        cfg:
          type: string
          description: "The tuning text of the machine; keys that hold secrets are shown empty."
        spindle:
          type: string
        spindle_guard:
          type: string
        spindle_original:
          type: object
        spindle_vfd:
          type: object
        allow_dollar:
          type: boolean
      required:
        - id
        - name
        - connection
    FleetJob:
      type: object
      properties:
        id:
          type: string
        percent:
          type: number
        items_done:
          type: integer
        items_total:
          type: integer
        pause:
          oneOf:
            - type: object
            - type: "null"
        tool:
          oneOf:
            - type: integer
            - type: "null"
    Fleet:
      type: object
      properties:
        stations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              machines:
                type: array
                items:
                  type: string
            required:
              - id
              - machines
            additionalProperties: false
        machines:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              model:
                type: string
              station:
                type: string
              connection:
                "$ref": "#/components/schemas/Connection"
              state:
                type: string
                enum:
                  - idle
                  - busy
                  - waiting
              job:
                oneOf:
                  - "$ref": "#/components/schemas/FleetJob"
                  - type: "null"
              ready:
                type: integer
            required:
              - id
              - state
        summary:
          type: object
          additionalProperties: true
        pnp_nodes:
          type: object
          additionalProperties: true
          description: "Present only while the switch `pnp_nodes_enabled` is on: how many nodes of the pick-and-place machines there are (`registered`), how many are ready (`ready`, `not_ready`) and the count of each health (`by_health`)."
      required:
        - stations
        - machines
        - summary
      additionalProperties: false
    DrillTool:
      type: object
      properties:
        number:
          type: integer
        extra_stroke_mm:
          type: number
        feed_mm_min:
          type: number
        spindle_rpm:
          type: number
      required:
        - number
    RouteTool:
      type: object
      properties:
        number:
          type: integer
        depth_mm:
          type: number
        iterations:
          type: integer
        feed_xy_mm_min:
          type: number
        feed_z_mm_min:
          type: number
        spindle_rpm:
          type: number
      required:
        - number
    RackSlot:
      type: object
      properties:
        tool:
          type: integer
          minimum: 0
          maximum: 255
        place:
          type: integer
          minimum: 1
      required:
        - tool
        - place
      additionalProperties: false
      description: The place of the rack one tool of the job is in.
    JobRackV2:
      type: object
      properties:
        first:
          type: integer
          minimum: 0
          default: 0
          description: "How many places of the rack the tools of the jobs before this one take (0 for the first job of the load)."
        carry_in:
          type: boolean
          default: false
          description: "The chuck comes holding the last tool of the job before: the first change takes it to its place and picks the first tool of this job."
        carry_out:
          type: boolean
          default: false
          description: This job leaves its last tool in the chuck for the next one.
        slots:
          type: array
          items:
            "$ref": "#/components/schemas/RackSlot"
          description: "The place of each tool of this job; a tool that is not listed is taken from the place the order of the job gives it."
        carry_slot:
          type: integer
          minimum: 1
          description: "With `carry_in`, the place of the tool the chuck comes holding."
      description: "The chaining of the tool changer of a request of the second version. Every field is optional; a field this server does not know is left out and named in a warning. See docs/ATC_CHAIN.md."
    DrillRequest:
      type: object
      properties:
        kind:
          type: string
          const: drill
        name:
          type: string
        board_mm:
          type: number
          minimum: 0
          maximum: 50
        tools:
          type: array
          items:
            "$ref": "#/components/schemas/DrillTool"
        holes:
          type: array
          items:
            type: object
            properties:
              tool:
                type: integer
              x_mm:
                type: number
              y_mm:
                type: number
            required:
              - tool
              - x_mm
              - y_mm
            additionalProperties: false
        files:
          type: object
          properties:
            ncd:
              type: string
            dtd:
              type: string
          additionalProperties: false
        sorting:
          type: string
          enum:
            - none
            - x
            - "y"
            - special
        skip:
          type: integer
        skip_tools:
          type: array
          items:
            type: integer
        request_version:
          type: integer
          minimum: 1
          description: "`2` when `rack` is present; absent in the requests of the first version."
        rack:
          "$ref": "#/components/schemas/JobRackV2"
      required:
        - kind
      additionalProperties: false
      description: "The holes or the files, not both (`both_sources`)."
    RouteRequest:
      type: object
      properties:
        kind:
          type: string
          const: route
        name:
          type: string
        tools:
          type: array
          items:
            "$ref": "#/components/schemas/RouteTool"
        paths:
          type: array
          items:
            type: object
            properties:
              pen:
                type: integer
              points_mm:
                type: array
                items:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
            required:
              - pen
              - points_mm
            additionalProperties: false
        files:
          type: object
          properties:
            plt:
              type: string
            rtd:
              type: string
          additionalProperties: false
        skip:
          type: integer
        skip_tools:
          type: array
          items:
            type: integer
        request_version:
          type: integer
          minimum: 1
          description: "`2` when `rack` is present; absent in the requests of the first version."
        rack:
          "$ref": "#/components/schemas/JobRackV2"
      required:
        - kind
      additionalProperties: false
      description: "The paths or the files, not both (`both_sources`)."
    GcodeRequest:
      type: object
      properties:
        kind:
          type: string
          const: gcode
        name:
          type: string
        gcode:
          type: string
          description: "The text of the program; at most a million lines."
        skip:
          type: integer
        restore_outputs:
          type: boolean
      required:
        - kind
        - gcode
      additionalProperties: false
    JobRequest:
      oneOf:
        - "$ref": "#/components/schemas/DrillRequest"
        - "$ref": "#/components/schemas/RouteRequest"
        - "$ref": "#/components/schemas/GcodeRequest"
      discriminator:
        propertyName: kind
    Pause:
      type: object
      properties:
        kind:
          type: string
          enum:
            - tool_change
            - spindle_start
            - hold
            - resume
        tool:
          type: integer
      required:
        - kind
      additionalProperties: false
    JobView:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        tools:
          type: array
          items:
            type: object
        holes:
          type: array
          items:
            type: object
        paths:
          type: array
          items:
            type: object
        bounds_mm:
          type: array
          items:
            type: number
        items:
          type: integer
        hole_ends:
          type: array
          items:
            type: integer
        estimate_s:
          type: number
        travel_mm:
          type: number
        skipped_tools:
          type: array
          items:
            type: integer
        skipped:
          type: integer
        dry_run:
          type: object
        warnings:
