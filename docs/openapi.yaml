      description: "Off until the switch `slice_enabled` of the security page is on. The small slicer of the server cuts a closed mesh (STL, or a 3MF whose model is stored or deflated) into layers with an outline and a rectilinear infill; the engine `phoenix` runs the program of the suite that `slice_phoenix_bin` names, with a time limit and no input. The program that comes out is read again against the limits of the profile: an object that does not fit, a temperature or a feed over the limit is a refusal and nothing is cut down. The mesh, the layers, the work and the program have limits (`slice_*` in `server.cfg`). Role operator or higher. Scope `jobs:prepare` if the token is limited by scopes."
