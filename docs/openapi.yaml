      properties:
        token:
          type: string
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        app:
          type: string
        session_id:
          type: string
          description: "Shown in the list of sessions; the token never is."
        expires_s:
          type: integer
      required:
        - token
        - name
        - role
        - app
        - session_id
        - expires_s
      additionalProperties: false
    AuthClaims:
      type: object
      properties:
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        is_token:
          type: boolean
        app:
          oneOf:
            - type: string
            - type: "null"
        session_id:
          oneOf:
            - type: string
            - type: "null"
        created:
          oneOf:
            - type: integer
            - type: "null"
        last_seen:
          oneOf:
            - type: integer
            - type: "null"
        expires:
          oneOf:
            - type: integer
            - type: "null"
        token_id:
          oneOf:
            - type: string
            - type: "null"
        template:
          oneOf:
            - type: string
            - type: "null"
        scopes:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      required:
        - name
        - role
        - is_token
      additionalProperties: false
      description: "The claims of the login: who, with which role, for which application, limited to which scopes (a token of a program has no session, so `app` is null)."
    AuthSession:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        app:
          type: string
          description: "Empty for a login made with `POST /login`."
        created:
          type: integer
        last_seen:
          type: integer
        expires:
          type: integer
        ip:
          type: string
        current:
          type: boolean
      required:
        - id
        - name
        - role
        - app
        - created
        - expires
        - current
      additionalProperties: false
    AuthSessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            "$ref": "#/components/schemas/AuthSession"
      required:
        - sessions
      additionalProperties: false
    Refreshed:
      type: object
      properties:
        expires_s:
          type: integer
      required:
        - expires_s
      additionalProperties: false
    LoggedOutAll:
      type: object
      properties:
        closed:
          type: integer
      required:
        - closed
      additionalProperties: false
    AuthPolicy:
      type: object
      properties:
        switches:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value: {}
              safe:
                type: boolean
            required:
              - key
              - value
              - safe
            additionalProperties: false
        attention:
          type: array
          items:
            type: string
        extra_apps:
          type: array
          items:
            type: string
        editable:
          type: array
          items:
            type: string
          description: "The keys `PUT /auth/policy` can change while the server runs."
        restart_required:
          type: array
          items:
            type: string
          description: "The `editable` keys whose change is kept at once but is read when the server starts (`network_open`: the address cannot change under a server that is listening)."
        changed:
          type: object
          properties:
            key:
              type: string
            from:
              description: "The value before (hidden as `***` for a secret key)."
            to:
              description: The value now.
            apply:
              type: string
              enum:
                - now
                - restart
              description: "`now`: in force already. `restart`: kept, and read when the server starts."
            restart_required:
              type: boolean
          required:
            - key
            - from
            - to
            - apply
            - restart_required
          additionalProperties: false
          description: "Only in the answer to `PUT /auth/policy`: what the change was and whether it needs a restart."
      required:
        - switches
        - attention
        - extra_apps
      additionalProperties: false
      description: "The switches of security of `server.cfg` with their values (never a secret) and, in `attention`, those that are looser than the recommended value."
    SettingsContract:
      type: object
      properties:
        schema:
          type: string
          description: "`eh3d.settings.contract/1`."
        server_version:
          type: string
          description: The version of the server that answers.
        languages:
          type: array
          items:
            type: string
        read:
          type: object
          additionalProperties: true
        write:
          type: object
          additionalProperties: true
          description: "The routes that write: `policy` (`PUT /auth/policy`) and `file` (`server.cfg`, no route)."
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
        settings:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              group:
                type: string
              type:
                type: string
                enum:
                  - boolean
                  - integer
                  - string
                  - list
              format:
                type: string
              min:
                type: integer
              max:
                type: integer
              max_length:
                type: integer
              unit:
                type: string
              default: {}
              apply:
                type: string
                enum:
                  - now
                  - restart
              write:
                type: object
                additionalProperties: true
                description: "`via` is `policy` (method and path of the route that writes the key) or `file` (method and path are null)."
              role:
                oneOf:
                  - type: string
                  - type: "null"
              scope:
                oneOf:
                  - type: string
                  - type: "null"
              confirm_when_looser:
                type: boolean
              secret:
                type: boolean
              risk:
                type: string
                enum:
                  - none
                  - security
                  - exposure
                  - capacity
                  - machine
                  - data
              label:
                type: object
                additionalProperties:
                  type: string
              help:
                type: object
                additionalProperties:
                  type: string
              warning:
                type: object
                additionalProperties:
                  type: string
            required:
              - key
              - group
              - type
              - default
              - apply
              - write
              - confirm_when_looser
              - secret
              - risk
              - label
              - help
              - warning
            additionalProperties: false
        values:
          type: object
          additionalProperties: true
          description: "The value in force of every key that is not secret; a secret key has none."
      required:
        - schema
        - server_version
        - languages
        - write
        - groups
        - settings
        - values
      additionalProperties: false
      description: "Every key of `server.cfg` with its type, range, default, group, whether a change is read at once, the route that writes it, and its label, help and warning in en, es, de, fr, it, ja, zh and pt; the same document as `docs/settings-contract.json` plus `server_version` and `values`."
    AuthApps:
      type: object
      properties:
        apps:
          type: array
          items:
            type: string
        known_only:
          type: boolean
      required:
        - apps
        - known_only
      additionalProperties: false
    SettingsValues:
      type: object
      properties:
        schema:
          type: string
          description: "`eh3d.settings.values/1`."
        server_version:
          type: string
          description: The version of the server that answers.
        contract_hash:
          type: string
          description: "The SHA-256 (hex) of the contract document with LF line ends; a client that holds a copy of the contract reads it again only when this changes."
        count:
          type: integer
        settings:
          type: object
          description: By key of the contract.
          additionalProperties:
            type: object
            properties:
              v:
                description: "The value in force; `***` for a key marked `secret`; absent for a key whose format is `path`."
              origin:
                type: string
                enum:
                  - file
                  - override
                description: "`override` when a change through the security page differs from `server.cfg`; absent for a secret key."
              editable:
                type: boolean
              secret:
                type: boolean
              hidden:
                type: boolean
              truncated:
                type: boolean
            required:
              - editable
            additionalProperties: false
      required:
        - schema
        - server_version
        - contract_hash
        - count
        - settings
      additionalProperties: false
      description: "The light, read-only view of the settings: a few kilobytes, no texts, no secret and no path."
    PolicyChange:
      type: object
      properties:
        key:
          type: string
          description: "One of `editable` in `GET /auth/policy`."
        value:
          description: "A boolean or a whole number, as the key takes."
        confirm_weak:
          type: boolean
          default: false
          description: Needed when the new value is looser than the recommended one.
      required:
        - key
        - value
      additionalProperties: false
      description: "Changes one switch of security while the server runs. The change is kept in `policy.json` of the data folder and wins over `server.cfg` for that key."
    AuthKeys:
      type: object
      properties:
        tokens:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              role:
                "$ref": "#/components/schemas/Role"
              created:
                type: integer
              last_used:
                oneOf:
                  - type: integer
                  - type: "null"
              expires:
                oneOf:
                  - type: integer
                  - type: "null"
              age_s:
                type: integer
              template:
                oneOf:
                  - type: string
                  - type: "null"
            required:
              - id
              - name
              - role
              - created
              - age_s
            additionalProperties: false
        tls:
          type: object
          properties:
            configured:
              type: boolean
            sha256:
              oneOf:
                - type: string
                  description: "SHA-256 of the certificate, in hexadecimal."
                - type: "null"
          required:
            - configured
            - sha256
          additionalProperties: false
          description: "The certificate that `tls_cert_file` names, the one the proxy in front of the server shows; the server does not terminate TLS itself."
      required:
        - tokens
        - tls
      additionalProperties: false
      description: "Identifiers, ages and the fingerprint of the certificate; never a secret."
    AuditLine:
      type: object
      properties:
        at:
          type: integer
        event:
          type: string
        who:
          type: string
      required:
        - at
        - event
      description: "The fields the event was written with (`who`, `role`, `ip`, ...); never a password or a token."
    AuditLines:
      type: object
      properties:
        enabled:
          type: boolean
        lines:
          type: array
          items:
            "$ref": "#/components/schemas/AuditLine"
      required:
        - enabled
        - lines
      additionalProperties: false
      description: "The newest first. `enabled` is false when `audit_file` is off and there is nothing to read."
    AppQuota:
      type: object
      properties:
        app:
          type: string
        limits:
          type: object
          properties:
            project_max_mb:
              type: integer
            project_max_file_mb:
              type: integer
            project_max_files:
              type: integer
            project_max_projects:
              type: integer
          required:
            - project_max_mb
            - project_max_file_mb
            - project_max_files
            - project_max_projects
          additionalProperties: false
        usage:
          type: object
          properties:
            projects_in_app:
              type: integer
            projects_left:
              type: integer
            visible_projects:
              type: integer
            bytes:
              type: integer
            files:
              type: integer
          required:
            - projects_in_app
            - projects_left
            - visible_projects
            - bytes
            - files
          additionalProperties: false
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              bytes:
                type: integer
              files:
                type: integer
              bytes_left:
                type: integer
              files_left:
                type: integer
            required:
              - id
              - name
              - bytes
              - files
              - bytes_left
              - files_left
            additionalProperties: false
      required:
        - app
        - limits
        - usage
        - projects
      additionalProperties: false
      description: "The limits of the store and what the application uses of them, for the projects the caller sees (at most 200 listed, the last changed first)."
    DesignJobRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
            - check
            - bom
            - fabpack
            - panel
        project:
          type: string
          description: "The id of a project of the `pcb` application."
        file:
          type: string
          description: "The board file of the project (`options.file` also works)."
        options:
          type: object
          properties:
            profile:
              type: string
            lang:
              type: string
            panel_boards:
              type: integer
              minimum: 1
              maximum: 1000
            dnp:
              type: array
              items:
                type: string
          additionalProperties: false
          description: "Only `fabpack` takes options (`profile`, `lang`, `panel_boards`, `dnp`); the other kinds take none."
      required:
        - kind
        - project
security:
  - bearerAuth: []
