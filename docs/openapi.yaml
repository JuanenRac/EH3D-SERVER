  "/events/stream":
    get:
      operationId: get_events_stream
      tags:
        - work
      summary: "Open the stream of events (server-sent events)"
      description: "Every event is `id: <number>`, `event: <kind>` and `data: <JSON>`. First `hello` (`last_id`, `resumed`, `resync`, `clients`), then the events of the kinds `project.*`, `job.created`, `job.state`, `job.progress` (every tenth of the work), `machine.*`, `catalog.changed` and `notification`, those the caller may see and its token's scopes allow. With `Last-Event-ID` the events kept after that number (the last `events_queue`) come first; `resync: true` in the `hello` says some were lost and the client has to ask for the state again, as does the event `resync` for a client that falls behind. A comment line (`: ping`) every `events_ping_s` seconds keeps the connection alive; the stream ends when the login ends. At most `events_clients_max` clients listen at once. The websocket `GET /events` is not changed. Role viewer or higher."
      x-role: viewer
      x-error-codes:
        - too_many_clients
        - unauthorized
      parameters:
        - name: machine
          in: query
          required: false
          description: Only the events about this machine.
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: Only the events about this project.
          schema:
            type: string
        - name: job
          in: query
          required: false
          description: Only the events about this job.
          schema:
            type: string
        - name: app
          in: query
          required: false
          description: Only the events of this application.
          schema:
            type: string
        - name: kinds
          in: query
          required: false
          description: "Kinds separated by commas; `job` matches `job.state`, `job.created`..."
          schema:
            type: string
        - name: last_event_id
          in: query
          required: false
          description: "Where to go on from (the header `Last-Event-ID` does the same; a browser sends it by itself when it reconnects)."
          schema:
            type: integer
            minimum: 0
        - name: ticket
          in: query
          required: false
          description: "A ticket from `POST /tickets` (an EventSource cannot set a header)."
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: "The token itself; only when `url_token` is on."
          schema:
            type: string
      security:
        - bearerAuth: []
        - ticketAuth: []
      responses:
        "200":
          description: Done.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: "Refused with `unauthorized`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: unauthorized
                detail: ""
        "429":
          description: "Refused with `too_many_clients`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorBody"
              example:
                error: too_many_clients
                detail: ""
