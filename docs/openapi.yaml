          additionalProperties: true
        limits:
          type: object
          additionalProperties: true
        read:
          type: object
          additionalProperties: true
        gcode:
          type: string
          description: "The program, when `output` is `view`."
        artifact:
          type: object
          additionalProperties: true
          description: "The artifact that holds the program, when `output` is `artifact`."
