[package]
name = "eh3d-server"
version = "0.0.1"
edition = "2021"
description = "The EH3D server: takes jobs from the EH3D programs and runs them on the machines through their nodes"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-SERVER"
readme = "README.md"

[lib]
name = "eh3d_server"
path = "src/lib.rs"

[[bin]]
name = "eh3d-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.5", features = ["limit"] }
eh3d-drillpro = { path = "../EH3D-DRILLPRO" }
eh3d-routepro = { path = "../EH3D-ROUTEPRO" }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
