[package]
name = "eh3d-server"
version = "0.1.4"
edition = "2021"
description = "The EH3D server: takes jobs from the EH3D programs and runs them on the machines through their nodes"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-SERVER"
readme = "README.md"

[features]
# GRBL controllers on a serial port of the computer the server runs on (machines of the kind `grbl`)
serial = ["eh3d-controller/serial"]

[lib]
name = "eh3d_server"
path = "src/lib.rs"

[[bin]]
name = "eh3d-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
# the stream of events (server-sent events) is built with futures_util::stream::unfold
futures-util = "0.3"
tower-http = { version = "0.5", features = ["limit", "fs"] }
eh3d-drillpro = { version = ">=0.1.0", path = "../EH3D-DRILLPRO" }
eh3d-routepro = { version = ">=0.1.0", path = "../EH3D-ROUTEPRO" }
eh3d-summary = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/summary" }
eh3d-inspect = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/inspect" }
eh3d-diagnostic = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/diagnostic" }
eh3d-controller = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/controller" }
eh3d-container = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/container" }
eh3d-materials = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/materials" }

[dev-dependencies]
# the test of the programs reads the fleet the way a program does
eh3d-fleet = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/fleet" }
tower = { version = "0.4", features = ["util"] }
# the test of the websocket speaks to the server on a real socket
tokio = { version = "1", features = ["io-util"] }
http-body-util = "0.1"
# the test draws a board and sends it as the camera of the node would
jpeg-encoder = "0.6"

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"
